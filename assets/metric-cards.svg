    <rect x="0" y="0" width="212" height="108" rx="12" fill="none" stroke="url(#c2Grad)" stroke-width="1" class="card-border" stroke-opacity="0.4" />
    
    <g transform="translate(18, 22)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="14" y="8" fill="#94a3b8" class="font-sans" font-size="11" font-weight="600" letter-spacing="0.5">RESEARCH &amp; PAPERS</text>
    </g>

    <text x="18" y="66" fill="#f8fafc" class="font-sans" font-size="22" font-weight="700">Springer LNNS</text>
    <text x="18" y="88" fill="#94a3b8" class="font-sans" font-size="11" font-weight="500">ICT4SD 2026 • Microplastic AI</text>
  </g>

  <!-- ================= ✏️ EDITABLE CARD 3: HACKATHONS ================= -->
  <g transform="translate(456, 0)">
    <rect x="0" y="0" width="212" height="108" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect x="0" y="0" width="212" height="108" rx="12" fill="none" stroke="url(#c3Grad)" stroke-width="1" class="card-border" stroke-opacity="0.4" />
    
