<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 20" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0" />
      <stop offset="25%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="shimmerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes moveShimmer {
      0% { transform: translateX(50px); }
      100% { transform: translateX(840px); }
    }
    .shimmer-bead {
      animation: moveShimmer 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Base Line -->
  <line x1="20" y1="10" x2="876" y2="10" stroke="url(#dividerGrad)" stroke-width="1.2" />

  <!-- Center Diamond Accent -->
  <polygon points="448,6 452,10 448,14 444,10" fill="#38bdf8" opacity="0.8" />

  <!-- Moving Subtle Glow Bead -->
  <circle cx="0" cy="10" r="12" fill="url(#shimmerLight)" class="shimmer-bead" />
</svg>
